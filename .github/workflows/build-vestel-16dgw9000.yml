name: Build Vestel 16DGW9000 OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath ccache

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt for Vestel 16DGW9000
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_vestel_16dgw9000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_INITRAMFS_COMPRESSION_NONE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7663-firmware-ap=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-8021q=y
          CONFIG_PACKAGE_uboot-envtools=y
          EOF
          make defconfig

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vestel-16dgw9000-openwrt
          path: bin/targets/econet/en751221/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vestel-v1.2
          name: Vestel 16DGW9000 OpenWrt v1.2
          files: |
            bin/targets/econet/en751221/*vestel*
            bin/targets/econet/en751221/*initramfs*
