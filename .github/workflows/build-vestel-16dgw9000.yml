name: Build Vestel 16DGW9000 OpenWrt

on:
  w orkflow_dispatch:

permissions:
  contents: w rite

jobs:
  build:
    runs-on: ubuntu-24.0 4
    steps:
      - name: Checkout
        u ses: actions/checkout@v4

      - name: Maxim ize build space
        run: |
          sudo  rm -rf /usr/share/dotnet /usr/local/lib/andr oid /opt/ghc /opt/hostedtoolcache/CodeQL
           df -h

      - name: Install build depe ndencies
        run: |
          sudo apt-ge t update
          sudo apt-get install -y bu ild-essential clang flex bison g++ gawk \
             gcc-multilib g++-multilib gettext gi t libncurses5-dev libssl-dev \
            py thon3-setuptools rsync swig unzip zlib1g-dev  file wget \
            libelf-dev ecj fastja r java-propose-classpath ccache

      - name : Update and install feeds
        run: |
           ./scripts/feeds update -a
          ./ scripts/feeds install -a

      - name: Confi gure OpenWrt for Vestel 16DGW9000
        run : |
          cat << 'EOF' > .config
           CONFIG_TARGET_econet=y
          CONFIG_TAR GET_econet_en751221=y
          CONFIG_TARGET _econet_en751221_DEVICE_vestel_16dgw9000=y
           CONFIG_TARGET_ROOTFS_INITRAMFS=y
           CONFIG_TARGET_INITRAMFS_COMPRESSION_NON E=y
          CONFIG_PACKAGE_luci=y
           CONFIG_PACKAGE_luci-ssl=y
          CONFIG_P ACKAGE_wpad-basic-mbedtls=y
          CONFIG_ PACKAGE_kmod-mt7603=y
          CONFIG_PACKAG E_kmod-mt7615e=y
          CONFIG_PACKAGE_kmo d-mt7663-firmware-ap=y
          CONFIG_PACKA GE_kmod-usb3=y
          CONFIG_PACKAGE_kmod- 8021q=y
          CONFIG_PACKAGE_uboot-envtoo ls=y
          EOF
          make defconfig

       - name: Build Firmware
        run: |
           make -j$(nproc) || make -j1 V=s

       - name: Upload Artifacts
        uses: act ions/upload-artifact@v4
        with:
           name: vestel-16dgw9000-openwrt
          p ath: bin/targets/econet/en751221/*

      - n ame: Create Release
        uses: softprops/a ction-gh-release@v2
        with:
          t ag_name: vestel-v1.2
          name: Vestel 1 6DGW9000 OpenWrt v1.2
          files: |
             bin/targets/econet/en751221/*vestel*
             bin/targets/econet/en751221/*init ramfs* 